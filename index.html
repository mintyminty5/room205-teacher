<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나도 낯선 순간이 있었다</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 전역 ===== */
:root{
  --ink:#22262B;--paper:#FBFAF4;--rule:#C9D8E6;--pencil:#4A5563;
  --gold:#D9B45B;--red:#B0413E;--green:#3F5A48;
  --ui:'Noto Sans KR',system-ui,sans-serif;
  --hand:'Nanum Pen Script',cursive;
  --serif:'Nanum Myeongjo',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:0}
.app{width:100%;max-width:560px;padding:28px 16px 40px;transition:background .6s}

/* 배경색 — 방마다 */
.bg-cover{background:linear-gradient(135deg,#1a1a2e,#2d2d4a)}
.bg-r1{background:radial-gradient(ellipse 60% 45% at 50% 12%,rgba(243,227,184,.28),transparent 70%),#2F3A44}
.bg-r2{background:radial-gradient(ellipse 60% 40% at 50% 10%,rgba(200,220,240,.18),transparent 70%),#2A3340}
.bg-r3{background:radial-gradient(ellipse 60% 40% at 50% 10%,rgba(243,227,184,.2),transparent 70%),#33302B}
.bg-r4{background:radial-gradient(ellipse 60% 40% at 50% 10%,rgba(225,48,108,.14),transparent 70%),#2B2733}
.bg-r5{background:radial-gradient(ellipse 60% 45% at 50% 12%,rgba(243,227,184,.28),transparent 70%),#2F3A44}
.bg-pause{background:linear-gradient(135deg,#2a2010,#3a3020)}
.bg-final{background:linear-gradient(135deg,#1a2a1a,#2a3a2a)}

/* 진행 바 */
.prog-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-bottom:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .5s}
.roomtag{color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.08em;text-align:center;margin-bottom:14px}

/* 뷰 전환 */
.view{display:none}.view.on{display:block}
button{font-family:var(--ui);cursor:pointer;border:0}
.btn{background:var(--gold);color:#2b2410;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;transition:transform .15s}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.35)}
.btn.dark{background:#22262B;color:#fff}
.btn:focus-visible,.obj:focus-visible,.pill:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ===== 커버 ===== */
.cover{color:#fff;text-align:center;padding:60px 10px}
.cover h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.35;margin-bottom:8px}
.cover .sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:40px}
.cover p{font-family:var(--serif);font-size:17px;line-height:2;color:rgba(255,255,255,.9);margin-bottom:18px}
.cover .rooms{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:30px 0}
.cover .rooms span{font-size:12px;padding:4px 12px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:rgba(255,255,255,.7)}
.rooms span.done{background:rgba(255,215,0,.25);border-color:var(--gold);color:var(--gold)}

/* ===== 방 공통 ===== */
.intro{color:#fff;text-align:center;padding:36px 10px}
.intro h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.35;margin-bottom:6px}
.intro .sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:34px}
.intro p{font-family:var(--serif);font-size:17px;line-height:2;color:rgba(255,255,255,.9);margin-bottom:18px}
.intro .role{display:inline-block;margin:10px 0 28px;padding:10px 18px;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:14px;color:#fff}

.desk{border-radius:14px;padding:22px 18px 18px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.desk.wood{background:linear-gradient(180deg,#6B4E36,#5A4030)}
.desk.slate{background:linear-gradient(180deg,#5A5F6B,#464B56)}
.desk.warm{background:linear-gradient(180deg,#5C574F,#48443E)}
.desk.purple{background:linear-gradient(180deg,#4B4456,#39333F)}
.desk .lead{font-family:var(--serif);font-size:15px;line-height:1.8;margin-bottom:16px;color:#F3E3B8}
.desk .lead.light{color:#E9EEF5}
.desk .lead.pink{color:#F3E6EC}

.objects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.obj{position:relative;border-radius:10px;padding:18px 14px;text-align:left;min-height:118px;transition:transform .15s;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.obj:hover{transform:translateY(-3px)}
.obj .t{font-weight:700;font-size:15px;margin-bottom:6px}
.obj .d{font-size:12px;opacity:.85;line-height:1.5}
.obj.nb{background:var(--paper);color:var(--ink);background-image:repeating-linear-gradient(180deg,transparent 0 23px,var(--rule) 23px 24px)}
.obj.nb::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:#E7A9A9}
.obj.log{background:var(--green);color:#F1EFE6}
.obj.steel{background:linear-gradient(180deg,#7A8794,#56616C);color:#fff}
.obj.steel.open{background:linear-gradient(180deg,#9BB59F,#6F8F76)}
.obj.phone{background:#1E2430;color:#fff;border:3px solid #3a4250}
.obj.yellow{background:#F4B400;color:#2b2410}
.obj.pink{background:#F6D5D5;color:var(--ink)}
.obj.ig{background:linear-gradient(135deg,#F58529,#DD2A7B 60%,#8134AF);color:#fff}
.obj.dm{background:#1E2430;color:#fff;border:3px solid #3a4250}
.obj.info{background:#EDEFF2;color:var(--ink)}
.obj.full{grid-column:1/-1;min-height:90px;display:flex;align-items:center;gap:14px}
.obj.full .ic{font-size:28px}
.obj.send{background:#FEE500;color:#2b2410}.obj.send.done{background:#A9D6A5}
.seen{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:2px 8px}

/* ===== 공통 UI ===== */
/* 공책 */
.paper{background:var(--paper);border-radius:6px;padding:26px 22px 22px 40px;position:relative;background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px);box-shadow:0 20px 40px rgba(0,0,0,.4);min-height:300px}
.paper::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1px;background:#E7A9A9}
.paper .cap{font-family:var(--serif);font-size:13px;color:#6a6f66;margin-bottom:14px}
.paper .date{font-family:var(--hand);font-size:22px;color:var(--ink);margin-bottom:4px}
.paper .body{font-family:var(--hand);font-size:24px;line-height:28px;color:var(--ink)}
.paper .margin{font-family:var(--hand);font-size:20px;line-height:28px;color:var(--pencil);opacity:.85;margin-top:28px;padding-left:8px;border-left:2px dotted #B9C2CC}
.paper .hand{font-family:var(--hand);font-size:25px;line-height:28px;color:var(--pencil)}
.paper .hand s{text-decoration-color:var(--pencil)}
.paper .torn{margin-top:20px;font-family:var(--serif);font-size:13px;color:#8a8f86}
.lastpage{font-family:var(--hand);font-size:26px;line-height:28px}

.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pill{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 16px;font-size:14px}
.pill:disabled{opacity:.3;cursor:default}
.idx{color:rgba(255,255,255,.65);font-size:13px}

/* 수업일지 */
.logpage{background:#F1EFE6;border-radius:6px;padding:22px 20px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.logpage h3{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:4px}
.logpage .who{font-size:12px;color:#6a6f66;margin-bottom:16px}
.entry{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:12px 0;border-top:1px solid #D8D6C8;font-family:var(--serif)}
.entry .dt{font-weight:700;font-size:14px;line-height:1.6}
.entry .q{font-size:15px;line-height:1.7}
.entry .r{font-size:14px;line-height:1.7;color:#555a52;margin-top:2px}
.entry .r.red{color:var(--red);font-weight:700}
.entry .r em{font-style:normal;background:#FDF0C0;padding:0 3px}

/* 카톡 */
.chat{border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.chat.kakao{background:#B2C7D9}
.chat.insta{background:#111;color:#fff}
.chat .hd{padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.chat.kakao .hd{background:rgba(255,255,255,.35)}
.chat.insta .hd{border-bottom:1px solid #2a2a2a}
.chat .hd small{font-weight:400;font-size:12px;color:#3f4b58}
.chat.insta .hd small{color:#999}
.chat .body{padding:14px 12px 26px;max-height:62vh;overflow-y:auto;scroll-behavior:smooth}
.day{text-align:center;font-size:11px;color:#3f4b58;margin:10px 0 8px}
.day span{background:rgba(0,0,0,.12);padding:3px 10px;border-radius:999px}
.chat.insta .day{color:#888}.chat.insta .day span{background:rgba(255,255,255,.1)}
.m{display:flex;margin-bottom:8px;align-items:flex-end;gap:6px}
.m.me{justify-content:flex-end}
.bub{max-width:74%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;word-break:keep-all}
.m.me .bub{background:#FEE500;border-bottom-right-radius:4px}
.m.o .bub{background:#fff;border-bottom-left-radius:4px}
.m.o.insta .bub{background:#262626;color:#fff}
.m.me.insta .bub{background:#3797F0;color:#fff;border-bottom-right-radius:4px}
.bub.del{background:#E4E9EE;color:#6b7683;font-style:italic;border:1px dashed #9aa6b2}
.meta{font-size:10px;color:#3f4b58;line-height:1.4;min-width:34px}
.m.me .meta{text-align:right}
.meta b{color:#C77C00;font-weight:700}
.chat.insta .meta{color:#888}
.note{font-size:11px;color:#bbb;text-align:center;margin:4px 0 12px}
.nm{font-size:11px;color:#3f4b58;margin:0 0 3px 36px}
.avatar{width:30px;height:30px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.lag{display:block;text-align:center;font-size:11px;color:#5a6a7a;margin:-2px 0 10px}
.lag em{font-style:normal;background:rgba(255,255,255,.55);padding:2px 8px;border-radius:999px}
.lag.slow em{background:#F9D8D2;color:#8a2e29}

/* 사물함 잠금 */
.panel{border-radius:12px;padding:26px 22px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,.45);text-align:center}
.panel.steel{background:linear-gradient(180deg,#7A8794,#56616C)}
.panel.send-panel{background:#1E2430}
.panel p{font-size:15px;line-height:1.8;margin-bottom:16px}
.panel input{font-family:var(--ui);font-size:28px;letter-spacing:.25em;text-align:center;width:220px;padding:10px 6px 10px 14px;border-radius:8px;border:2px solid #d5dde5;background:#eef2f5;color:#22262B}
.panel input:focus{outline:3px solid var(--gold)}
.compose{background:#FEE500;color:#2b2410;border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.8;text-align:left;margin-bottom:4px}
.compose input{font-family:var(--ui);font-size:18px;width:80px;text-align:center;border:0;border-bottom:2px solid #2b2410;background:transparent;padding:2px 4px;color:#2b2410;letter-spacing:.05em}
.compose input:focus{outline:2px solid #2b2410;border-radius:4px}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.msg{min-height:22px;font-size:14px;margin-top:12px;color:#FFE9A8;line-height:1.6}

/* 편지 */
.letter{background:var(--paper);border-radius:6px;padding:30px 26px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.letter .body{font-family:var(--hand);font-size:25px;line-height:1.55;white-space:pre-line;color:var(--ink)}

/* 발표자료 버전기록 */
.sl{background:#fff;border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.4);overflow:hidden}
.sl .hd{background:#F4B400;padding:12px 16px;font-weight:700;font-size:14px}
.sl .hd small{display:block;font-weight:400;font-size:12px;color:#5a4a00}
.vh{padding:8px 16px 14px}
.v{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:11px 0;border-top:1px solid #eee;font-size:13px;line-height:1.6}
.v .dt{color:#555;font-weight:700}.v .rev{color:var(--red);font-weight:700}
.v.hot{background:#FFF6D6;margin:0 -16px;padding:11px 16px}

/* 인스타 */
.ig-wrap{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.ig-wrap .ig-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #eee}
.ig-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF);display:flex;align-items:center;justify-content:center;font-size:20px}
.ig-hd b{display:block;font-size:14px}.ig-hd small{color:#777;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.post{aspect-ratio:1;border:0;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;cursor:pointer;overflow:hidden}.post img{width:100%;height:100%;object-fit:cover;display:block}.ig-detail .detail-photo{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:10px}
.post small{position:absolute;bottom:4px;right:6px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:999px}
.ig-detail{padding:14px;border-top:1px solid #eee;min-height:100px}
.ig-detail .cap{font-size:14px;line-height:1.6;margin-bottom:8px}
.ig-detail .meta{font-size:12px;color:#777;line-height:1.7}
.ig-detail .meta b{color:#333}
.ig-detail .warn{color:var(--red);font-weight:700}

/* 스토리 */
.story{background:#000;border-radius:18px;padding:22px 20px 26px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,.5);min-height:360px}
.story .bar{height:3px;background:#444;border-radius:2px;margin-bottom:14px;overflow:hidden}
.story .bar i{display:block;height:100%;width:0;background:#fff;animation:fill 3s linear forwards}
@keyframes fill{to{width:100%}}
.story .who{font-size:13px;color:#ccc;margin-bottom:26px}
.story .txt{font-family:var(--hand);font-size:27px;line-height:1.45;white-space:pre-line}

/* 생기부 초안 */
.cardsheet{background:#F6D5D5;border-radius:10px;padding:22px 20px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.cardsheet .cap{font-family:var(--serif);font-size:13px;color:#7a5b5b;margin-bottom:12px}
.cardsheet .hand{font-family:var(--hand);font-size:25px;line-height:1.4;color:var(--ink)}
.cardsheet .sig{font-family:var(--hand);font-size:22px;text-align:right;margin-top:14px;color:var(--pencil)}

/* ===== 멈춤 카드 ===== */
.pause-card{color:#fff;text-align:center;padding:40px 20px}
.pause-card .ic{font-size:60px;margin-bottom:20px}
.pause-card h2{font-family:var(--serif);font-size:24px;margin-bottom:12px;color:var(--gold)}
.pause-card p{font-family:var(--serif);font-size:17px;line-height:2;color:rgba(255,255,255,.9);margin-bottom:12px}
.pause-card .q{font-size:19px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border-radius:12px;padding:16px 20px;margin:16px 0;line-height:1.6}
.timer-ring{width:80px;height:80px;margin:20px auto}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .track{fill:none;stroke:rgba(255,255,255,.2);stroke-width:6}
.timer-ring .prog{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset 1s linear}
.timer-num{font-size:22px;font-weight:700;color:var(--gold);text-align:center;margin-top:-58px;line-height:80px}

/* ===== 최종 미션 ===== */
.final{color:#fff;padding:20px 0}
.final h2{font-family:var(--serif);font-size:26px;margin-bottom:8px;color:var(--gold)}
.final .sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:24px}
.step-block{background:rgba(255,255,255,.08);border-radius:12px;padding:20px;margin-bottom:16px;border-left:4px solid var(--gold)}
.step-block h3{font-family:var(--serif);font-size:17px;margin-bottom:10px;color:var(--gold)}
.step-block p{font-size:15px;line-height:1.8;color:rgba(255,255,255,.9);margin-bottom:14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px 16px;font-size:14px;color:#fff;text-align:left;transition:all .2s}
.choice:hover,.choice.selected{background:rgba(255,215,0,.2);border-color:var(--gold);color:#fff}
.choice.correct{background:rgba(100,200,100,.25);border-color:#6dc88a}
.step-block textarea{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:12px;color:#fff;font-size:15px;font-family:var(--ui);resize:none;min-height:80px;line-height:1.6}
.step-block textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.step-block textarea::placeholder{color:rgba(255,255,255,.4)}
.final-msg{background:rgba(0,0,0,.3);border-radius:12px;padding:24px;margin-top:20px;text-align:center}
.final-msg p{font-family:var(--serif);font-size:16px;line-height:2.2;color:rgba(255,255,255,.9);margin-bottom:12px}
.final-msg .big{font-size:19px;color:var(--gold)}

/* ===== 교육 근거 카드 ===== */
.edu-card{
  border:1px solid #78A995;
  border-left:4px solid #0B624B;
  background:#DCEFE7;
  border-radius:10px;
  padding:16px 18px;
  margin:16px 0 20px;
  text-align:left;
}
.edu-tag{
  display:inline-block;
  background:#0F6E56;
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:10px;
  letter-spacing:.02em;
}
.edu-body{
  font-family:var(--serif);
  font-size:14px;
  line-height:1.85;
  color:#18382F;
}
.edu-body b{color:#0B624B}

/* ===== 엔딩 ===== */
.ending{color:#fff;text-align:center;padding:40px 10px}
.ending .ic{font-size:60px;margin-bottom:20px}
.ending h2{font-family:var(--serif);font-size:28px;margin-bottom:20px;color:var(--gold)}
.ending p{font-family:var(--serif);font-size:17px;line-height:2;color:rgba(255,255,255,.9);margin-bottom:16px}
.ending .names{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.ending .names span{padding:6px 14px;border:1px solid rgba(255,255,255,.4);border-radius:999px;font-size:14px}

/* 공통 */
.after{color:#fff;text-align:center;margin-top:26px}
.after p{font-family:var(--serif);font-size:16px;line-height:2;color:rgba(255,255,255,.9);margin-bottom:18px}
.after .big{font-size:19px;color:var(--gold)}
.back{margin-top:16px;text-align:center}
.credit{margin-top:26px;text-align:center;color:rgba(255,255,255,.35);font-size:11px;line-height:1.6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.obj:hover,.btn:hover{transform:none}}
</style>
</head>
<body>
<div class="app bg-cover" id="app">
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="roomtag" id="roomtag">나도 낯선 순간이 있었다</div>
  <div id="main"></div>
  <div class="credit">나도 낯선 순간이 있었다 · Minty.E · made in Minty Lab</div>
</div>

<script>
// ===================================================
// 전역 상태
// ===================================================
const S = {
  room: 0,        // 0=커버, 1~5=방, 6=멈춤1, 7=pause2, 8=final, 9=ending
  done: [false, false, false, false, false],
  r1: { seen: {} },
  r2: { seen: {} },
  r3: { seen: {} },
  r4: { seen: {} },
  r5: { seen: {}, pi: 0 },
  r1nb_pi: 0,

function render() {
  const el = document.getElementById('main');
  const tag = document.getElementById('roomtag');
  const r = S.room;
  if (r === 0) { tag.textContent = '나도 낯선 순간이 있었다'; el.innerHTML = coverHTML(); }
  else if (r === 1) { tag.textContent = '1방 — 아무도 듣지 못한 답'; el.innerHTML = r1HTML(); r1Init(); }
  else if (r === 2) { tag.textContent = '2방 — 웃으며 한 말'; el.innerHTML = r2HTML(); r2Init(); }
  else if (r === 3) { tag.textContent = '3방 — 세 번 지운 말'; el.innerHTML = r3HTML(); r3Init(); }
  else if (r === 4) { tag.textContent = '4방 — 3초 동안 올라왔던 이야기'; el.innerHTML = r4HTML(); r4Init(); }
  else if (r === 5) { tag.textContent = '5방 — 역시 민서'; el.innerHTML = r5HTML(); r5Init(); }
  else if (r === 6) { tag.textContent = '잠깐 멈추세요'; el.innerHTML = pause1HTML(); startPause(90, 7); }
  else if (r === 7) { tag.textContent = '잠깐 멈추세요'; el.innerHTML = pause2HTML(); startPause(60, 8); }
  else if (r === 8) { tag.textContent = '최종 미션'; el.innerHTML = finalHTML(); }
  else if (r === 9) { tag.textContent = '봉인 해제'; el.innerHTML = endingHTML(); }
  window.scrollTo({ top: 0 });
}

function startPause(seconds, nextRoom) {
  const isP1 = seconds === 90;
  const ringId = isP1 ? 'p1ring' : 'p2ring';
  const numId = isP1 ? 'p1num' : 'p2num';
  const btnId = isP1 ? 'p1btn' : 'p2btn';
  const circ = 2 * Math.PI * 35; // ≈ 220
  let t = seconds;
  const ring = document.getElementById(ringId);
  const num = document.getElementById(numId);
  const btn = document.getElementById(btnId);
  if (ring) ring.style.strokeDashoffset = circ;
  const iv = setInterval(() => {
    t--;
    const offset = circ * (t / seconds);
    if (ring) ring.style.strokeDashoffset = offset;
    if (num) num.textContent = t;
    if (t <= 0) {
      clearInterval(iv);
      if (btn) btn.style.display = 'inline-block';
    }
  }, 1000);
}

// ===================================================
// 유틸
// ===================================================
function shake(sel) {
  const el = document.querySelector(sel); if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function typeText(id, text, cb) {
  const el = document.getElementById(id); if (!el) return;
  el.textContent = '';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; if (cb) cb(); return; }
  let i = 0;
  (function t() {
    if (i <= text.length) { el.textContent = text.slice(0, i); i++; setTimeout(t, text[i - 1] === '\n' ? 170 : 36); }
    else if (cb) cb();
  })();
}
